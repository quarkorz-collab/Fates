name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
          - name: Linux GCC
            os: ubuntu-latest
          - name: macOS Clang
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Node for WebUI tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DFATES_ENABLE_AVX2=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Run WebUI unit tests
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_web*.py'
          node tests/test_web_commands.cjs
          node tests/test_web_numbers.cjs
          node tests/test_web_constant_counts.cjs

      - name: Run WebUI and constant count smoke tests
        shell: bash
        run: |
          binary=build/fates
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary=build/Release/fates.exe
            if [[ ! -f "$binary" ]]; then binary=build/fates.exe; fi
          fi
          python tests/check_web.py --bin "$binary"
          python tests/check_constant_count.py --bin "$binary"

      - name: Run command-line regression suite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x tests/smoke.sh
          tests/smoke.sh ./build/fates

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
          - name: Linux GCC
            os: ubuntu-latest
          - name: macOS Clang
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Node for WebUI tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DFATES_ENABLE_AVX2=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Run WebUI unit tests
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_web*.py'
          node tests/test_web_commands.cjs
          node tests/test_web_numbers.cjs
          node tests/test_web_constant_counts.cjs
          node tests/test_web_mobile_scroll.cjs

      - name: Run WebUI and constant count smoke tests
        shell: bash
        run: |
          binary=build/fates
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary=build/Release/fates.exe
            if [[ ! -f "$binary" ]]; then binary=build/fates.exe; fi
          fi
          python tests/check_web.py --bin "$binary"
          python tests/check_constant_count.py --bin "$binary"

      - name: Run command-line regression suite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x tests/smoke.sh
          tests/smoke.sh ./build/fates

  android:
    name: Android ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test Android bridge
        run: python -m unittest discover -s tests -p 'test_android*.py'

      - name: Build APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z -1 "$apk" > "$RUNNER_TEMP/apk-entries.txt"
          grep -Fxq 'lib/arm64-v8a/libfates.so' "$RUNNER_TEMP/apk-entries.txt"
          grep -Fxq 'assets/web/index.html' "$RUNNER_TEMP/apk-entries.txt"
          package="$RUNNER_TEMP/fates-android-arm64-debug.apk"
          cp "$apk" "$package"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$package")") > "$package.sha256"
          echo "FATES_APK=$package" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: fates-android-arm64-debug
          path: |
            ${{ env.FATES_APK }}
            ${{ env.FATES_APK }}.sha256
          compression-level: 0
          if-no-files-found: error
